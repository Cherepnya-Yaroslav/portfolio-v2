name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx playwright test --config playwright.transport.config.ts
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npm run typecheck

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://yaroslavdevelopment.ru
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy verified commit on VPS
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/portfolio-deploy-key"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          ssh -i "$key_file" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=deploy/ssh_known_hosts \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            portfolio-deploy@89.104.65.132 "deploy $GITHUB_SHA"
      - name: Check public website
        run: |
          for locale in ru en; do
            curl --fail --silent --show-error --retry 5 --retry-delay 3 \
              --max-time 45 "https://yaroslavdevelopment.ru/$locale" \
              --output "$RUNNER_TEMP/portfolio-$locale.html"
            grep -q 'class="pf-loader"' "$RUNNER_TEMP/portfolio-$locale.html"
          done
